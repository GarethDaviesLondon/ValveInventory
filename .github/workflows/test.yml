name: test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the database from the committed snapshot
        run: python3 snapshot.py --restore --force
      - name: Run smoke tests
        run: python3 test_smoke.py
